name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Restore or Generate Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias monexplorateur \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monexplorateur123 \
              -keypass monexplorateur123 \
              -dname "CN=MonExplorateur, OU=Android, O=Personal, L=France, S=France, C=FR"

          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          cp app/build/outputs/apk/release/app-release.apk "MonExplorateur-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MonExplorateur-release-apk
          path: MonExplorateur-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MonExplorateur-*.apk
          generate_release_notes: true
          body: |
            ## 🚀 MonExplorateur ${{ github.ref_name }}

            ### ✨ Fonctionnalités / Features
            - **Explorateur complet / Full File Manager** : navigation rapide, sélection multiple, copier/coller/déplacer, recherche et tri.
            - **Accès Shizuku & Root** : accès à `/Android/data` via Shizuku et à `/` via Root (`su`), activables à la demande dans les Réglages.
            - **Archives multi-formats** : création et extraction `.zip`, `.7z`, `.tar.gz`, et extraction `.rar`.
            - **Corbeille intégrée / Trash Bin** : suppression réversible avec restauration à l'emplacement d'origine.
            - **Serveur & Client FTP** : partage de fichiers en Wi-Fi sans câble.
            - **Inspecteur & Hash** : calcul MD5, SHA-1, SHA-256 et éditeur de texte intégré.
            - **Bilingue FR / EN & Thèmes** : changement instantané Français/English et thèmes Clair/Sombre/Système.



