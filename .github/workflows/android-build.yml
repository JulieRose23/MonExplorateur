name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Decode or generate release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias monexplorateur \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monexplorateur123 \
              -keypass monexplorateur123 \
              -dname "CN=MonExplorateur, OU=Android, O=Personal, L=France, S=France, C=FR"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: MonExplorateur-release
          path: app/build/outputs/apk/release/*.apk

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME")
          {
            echo "## Nouveautés ($TAG_NAME)"
            echo ""
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG"
              echo ""
            fi
            echo "### Changements inclus"
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..$TAG_NAME" --pretty=format:"* %s" --no-merges
            else
              git log -n 10 --pretty=format:"* %s" --no-merges
            fi
          } > release_notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release_notes.md